aid: facebook-business-manager
name: Facebook Business Manager
description: >-
  APIs for managing Facebook Business accounts, advertising, pages, and assets across the Meta platform family. Facebook
  Business Manager exposes a deep catalog of Graph API surfaces for marketing, pages, conversions, business asset
  management, Instagram, insights, Messenger, catalogs, live video, Threads, and the WhatsApp Business Platform, all
  governed through a shared authentication and access model.
