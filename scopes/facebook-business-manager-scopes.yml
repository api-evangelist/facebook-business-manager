provider: Facebook Business Manager
providerId: facebook-business-manager
description: >-
  Meta calls OAuth scopes "permissions" and publishes them in a single Permissions Reference for Meta
  Technologies APIs. Permissions are app-user-granted and gated by App Review; Advanced Access to any
  permission additionally requires Business Verification. The list below was read from that reference page on
  2026-08-13, plus the machine-readable scopes_supported arrays served by Meta's two MCP servers at
  /.well-known/oauth-protected-resource/{ads,devtools}.
  Note: derive-oauth-scopes.py produced nothing for this repo because the OpenAPI files in openapi/ declare a
  bearer http securityScheme rather than an oauth2 scheme with a scopes map — the scopes below are searched
  from the docs, not derived from a spec.
access_tiers:
  - name: Standard Access
    description: Default tier. Applies to data the app owns or manages. No App Review required for most permissions.
  - name: Advanced Access
    description: >-
      Required to access data owned by other businesses/users. Requires App Review, Business Verification,
      and (for permissions touching user data) an annual Data Use Checkup and, for advanced permissions, a
      Data Protection Assessment.
policies:
  - name: 90-day regrant
    description: If an app does not use a permission for 90 days, the app user must grant it again.
  - name: Granular consent
    description: App users may grant or deny any subset of the permissions an app requests.
  - name: Least privilege
    description: >-
      Meta names over-requesting as a common cause of App Review rejection ("Only select permissions that
      your app needs to function as intended").
mcp_scopes:
  - server: https://mcp.facebook.com/ads
    source: https://mcp.facebook.com/.well-known/oauth-protected-resource/ads
    method: probed
    scopes:
      - ads_management
      - ads_read
      - catalog_management
      - business_management
      - pages_show_list
      - instagram_basic
      - ads_mcp_management
  - server: https://mcp.facebook.com/devtools
    source: https://mcp.facebook.com/.well-known/oauth-protected-resource/devtools
    method: probed
    scopes:
      - developer_tools_mcp_app_read
      - developer_tools_mcp_app_management
