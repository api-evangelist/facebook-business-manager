  this crosswalk is at the TOOL-CATEGORY level, not the individual-tool level, because Meta publishes no
  readable tool inventory — tools/list on https://mcp.facebook.com/ads returns 401 without an OAuth token,
  and every per-category tool reference page returned HTTP 500 on 2026-08-13 (see tools_note in
  mcp/facebook-business-manager-mcp.yml). Each row below therefore names a category exactly as Meta's
  overview page names it, not a tool id, and confidence is set accordingly. No tool name has been invented.
