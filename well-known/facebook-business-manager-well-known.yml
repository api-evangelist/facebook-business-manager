generated: '2026-08-13'
method: probed
source: live HTTP probes against every host named in apis.yml baseURL + the docs/console hosts
specification: API Commons WellKnown
specificationVersion: '0.1'
provider: Facebook Business Manager
providerId: facebook-business-manager
description: >-
  Probe of /.well-known/ paths across the Graph API hosts (graph.facebook.com, graph.threads.net), the
  developer docs host (developers.facebook.com), the console host (business.facebook.com), the consumer host
  (www.facebook.com) and the MCP host (mcp.facebook.com). Three real documents are served: a security.txt on
  the www and business hosts, an OpenID Connect discovery document on www, and RFC 9728 OAuth protected-resource
  metadata for each of Meta's two remote MCP servers. The Graph API hosts themselves answer 400 to any
  /.well-known/ path because the Graph API treats the path as a node id, not a 404 — recorded as-is.
checked: '2026-08-13'
probes:
  - host: www.facebook.com
    path: /.well-known/security.txt
    url: https://www.facebook.com/.well-known/security.txt
    status: 200
    content_type: text/plain
    file: facebook-business-manager-security.txt
    document: true
  - host: business.facebook.com
    path: /.well-known/security.txt
    url: https://business.facebook.com/.well-known/security.txt
    status: 200
    document: true
    note: Identical body to the www.facebook.com security.txt; saved once.
  - host: www.facebook.com
    path: /.well-known/openid-configuration
    url: https://www.facebook.com/.well-known/openid-configuration
    status: 200
    content_type: application/json
    file: facebook-business-manager-openid-configuration.json
    document: true
    note: >-
      Real OIDC discovery document. issuer https://www.facebook.com, authorization_endpoint
      https://facebook.com/dialog/oauth/, jwks_uri https://www.facebook.com/.well-known/oauth/openid/jwks/,
      RS256, pairwise subjects. Covers Facebook Login, the identity layer under Business Manager access.
  - host: mcp.facebook.com
    path: /.well-known/oauth-protected-resource/ads
    url: https://mcp.facebook.com/.well-known/oauth-protected-resource/ads
    status: 200
    content_type: application/json
    file: facebook-business-manager-mcp-ads-oauth-protected-resource.json
    document: true
    note: >-
      RFC 9728 metadata for the Meta Ads MCP server. scopes_supported ads_management, ads_read,
      catalog_management, business_management, pages_show_list, instagram_basic, ads_mcp_management.
  - host: mcp.facebook.com
    path: /.well-known/oauth-protected-resource/devtools
    url: https://mcp.facebook.com/.well-known/oauth-protected-resource/devtools
    status: 200
    content_type: application/json
    file: facebook-business-manager-mcp-devtools-oauth-protected-resource.json
    document: true
    note: >-
      RFC 9728 metadata for the Meta Devtools MCP server. scopes_supported
      developer_tools_mcp_app_read, developer_tools_mcp_app_management.
  - host: www.facebook.com
    path: /.well-known/oauth-authorization-server
    url: https://www.facebook.com/.well-known/oauth-authorization-server
