    url: https://developers.facebook.com/docs/graph-api/changelog
  - name: Marketing API Changelog
    url: https://developers.facebook.com/docs/marketing-api/changelog
  - name: Instagram Platform Changelog
    url: https://developers.facebook.com/docs/instagram-platform/changelog
  - name: Messenger Platform Changelog
    url: https://developers.facebook.com/docs/messenger-platform/changelog
  - name: WhatsApp Business Platform Changelog
    url: https://developers.facebook.com/docs/whatsapp/business-platform-changelog
change_classes:
  - name: Versioned changes
    description: >-
      Introduced with a new API version. Apply to the newest version immediately and often to older versions
      at a stated future date.
  - name: Out-of-cycle changes
    description: >-
      Introduced outside the versioned release schedule and usually applied to ALL versions immediately.
      Meta states these are introduced infrequently. This is the class that breaks pinned integrations.
