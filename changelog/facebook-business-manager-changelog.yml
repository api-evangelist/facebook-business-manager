specification: API Commons ChangeLog
specificationVersion: '0.1'
provider: Facebook Business Manager
providerId: facebook-business-manager
description: >-
  Meta publishes a dated, versioned changelog for the Graph API and separate changelogs for the Marketing,
  Instagram, Messenger and WhatsApp Business platforms. Releases are date-stamped and every version carries a
  published "Available Until" date, which makes this one of the few provider changelogs in the catalog that
  doubles as a machine-usable sunset calendar.
scheme: major-version with dated release and dated expiry
current_version: v26.0
current_version_released: '2026-07-29'
versioned_path: true
version_in_path: 'https://graph.facebook.com/v26.0/...'
